services:
  # FastAPI Backend
  - type: web
    name: movie-recommender-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r ../requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12
      - key: DATABASE_URL
        value: postgresql://... # Render will create this
      - key: SECRET_KEY
        value: your-secret-key-change-this
      - key: DEBUG
        value: false
      - key: ALLOWED_ORIGINS
        value: https://movie-recommender-frontend.onrender.com

  # Streamlit Frontend
  - type: web
    name: movie-recommender-frontend
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app.py --server.port $PORT --server.address 0.0.0.0
    envVars:
      - key: PYTHON_VERSION
        value: 3.12
      - key: API_BASE_URL
        value: https://movie-recommender-api.onrender.com
      - key: TMDB_API_KEY
        value: your-tmdb-api-key
      - key: DEBUG
        value: false
